name: BlueNode checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test with public example configuration
        env:
          NODESMART_CONFIG: ${{ github.workspace }}/config/nodesmart.example.json
        run: python -m unittest discover -s core -v

  dashboard:
    name: Dashboard regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bluenode-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/bluenode-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run all dashboard suites with synthetic node data
        run: |
          export NODE_PATH="$RUNNER_TEMP/bluenode-browser/node_modules"
          for suite in core/test_*.js; do
            node "$suite"
          done

  repository:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check public tree
        shell: pwsh
        run: ./deploy/Test-PublicTree.ps1
      - name: Test deployment tooling with disposable local repositories
        shell: pwsh
        run: ./deploy/Test-DeployBlueNode.ps1
